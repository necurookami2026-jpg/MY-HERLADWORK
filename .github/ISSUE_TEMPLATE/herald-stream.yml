name: Herald stream audience submission
description: Propose a problem to solve or a change to the stream rules
title: "[Herald stream] "
body:
  - type: dropdown
    id: submission
    attributes:
      label: Submission type
      options:
        - Problem to solve
        - Rule proposal
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current problem or rule
      description: Describe the observation and who it affects, or name the rule you want to change.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Desired outcome or proposed wording
      description: Describe what should improve, or write the replacement rule.
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: Evidence or success check
      description: Share an observation or describe how the audience can tell whether the change helped.
    validations:
      required: true
